<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA: "Thêm vào màn hình chính" mở toàn màn hình, không có thanh trình duyệt. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Màu nền mặc định của app: iOS dùng làm màu thanh trạng thái khi mở từ màn hình chính. -->
    <meta name="theme-color" content="#EFEDE7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KTX DN" />
    <!-- "black-translucent": cho phép nền app tràn lên vùng tai thỏ thay vì dải trắng mặc định của iOS.
         Kết hợp với `html.standalone { position: fixed; inset: 0; }` bên dưới để giữ đúng chiều cao toàn màn hình. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Safari iPhone: 100% chỉ bằng chiều cao lúc thanh trình duyệt đang hiện, thu thanh lại thì đáy
         lộ khoảng trống. 100dvh luôn bằng phần đang nhìn thấy nên thanh tab bám sát đáy như app. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      /* Mở từ icon ở màn hình chính (iOS): khóa trang tại chỗ để bàn phím không đẩy lệch giao diện. Kích thước
         lấy theo màn hình hiện tại (inset: 0) chứ không đóng băng số đo lúc mở, nên ra vào app vẫn vừa khít. */
      html.standalone,
      html.standalone body {
        position: fixed;
        inset: 0;
        height: auto;
        overflow: hidden;
        overscroll-behavior: none;
      }
      html.standalone #root {
        height: 100%;
      }
    </style>
    <script>
      /* Chế độ màn hình chính: bàn phím đóng hoặc quay lại app thì đưa trang về vị trí cũ (iOS cuộn trang để lộ
         ô nhập nhưng không tự cuộn lại). */
      (function () {
        var standalone =
          window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if (!standalone) return;
        document.documentElement.classList.add("standalone");
        function settle() {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        }
        document.addEventListener("focusout", function () {
          setTimeout(settle, 50);
        });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") setTimeout(settle, 50);
        });
        window.addEventListener("pageshow", settle);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            if (window.visualViewport.height >= window.innerHeight - 1) settle();
          });
        }
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
