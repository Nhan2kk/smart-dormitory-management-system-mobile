<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA: "Thêm vào màn hình chính" mở toàn màn hình, không có thanh trình duyệt. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KTX DN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Safari iPhone: 100% chỉ bằng chiều cao lúc thanh trình duyệt đang hiện, thu thanh lại thì đáy
         lộ khoảng trống. 100dvh luôn bằng phần đang nhìn thấy nên thanh tab bám sát đáy như app. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      /* Mở từ icon ở màn hình chính (iOS): khóa trang tại chỗ để bàn phím không đẩy lệch giao diện, và cao
         đúng cả màn hình (--app-height do script bên dưới tính). */
      html.standalone,
      html.standalone body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      html.standalone,
      html.standalone body,
      html.standalone #root {
        height: var(--app-height, 100dvh);
      }
    </style>
    <script>
      /* iOS ở chế độ màn hình chính với thanh trạng thái trong suốt báo chiều cao trang thiếu đúng bằng phần
         tai thỏ, để lại dải trống dưới thanh tab. Dùng chiều cao màn hình thật; bàn phím đóng thì đưa trang
         về vị trí cũ (iOS cuộn trang để lộ ô nhập nhưng không tự cuộn lại). */
      (function () {
        var standalone =
          window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if (!standalone) return;
        var root = document.documentElement;
        root.classList.add("standalone");
        function fit() {
          var portrait = window.innerHeight >= window.innerWidth;
          var screenHeight = portrait
            ? Math.max(window.screen.height, window.screen.width)
            : Math.min(window.screen.height, window.screen.width);
          root.style.setProperty("--app-height", Math.max(window.innerHeight, screenHeight) + "px");
        }
        function settle() {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        }
        fit();
        window.addEventListener("orientationchange", function () {
          setTimeout(fit, 300);
        });
        window.addEventListener("resize", fit);
        document.addEventListener("focusout", function () {
          setTimeout(settle, 50);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            if (window.visualViewport.height >= window.innerHeight - 1) settle();
          });
        }
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
